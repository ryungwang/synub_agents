spring:
  datasource:
    url: jdbc:h2:file:./data/local-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false

logging:
  level:
    com.company.aidevstaff: debug
