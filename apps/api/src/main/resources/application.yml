server:
  port: 8080

spring:
  application:
    name: synub-agents-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synub_agents}
    username: ${SPRING_DATASOURCE_USERNAME:synub_agents}
    password: ${SPRING_DATASOURCE_PASSWORD:synub_agents}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  admin:
    token: ${ADMIN_TOKEN:}
  github:
    token: ${GITHUB_TOKEN:}
    owner: ${GITHUB_OWNER:}
    repo: ${GITHUB_REPO:}
    ready-label: ${GITHUB_READY_LABEL:codex-ready}
  scheduler:
    github-poll-ms: ${AGENT_POLL_INTERVAL_MS:300000}
    worker-dispatch-ms: ${WORKER_DISPATCH_INTERVAL_MS:60000}
  worker:
    secret: ${WORKER_SECRET:local-worker-secret}
    workspace-root: ${CODEX_WORKSPACE_ROOT:}
    codex-command: ${CODEX_COMMAND:codex}
    claude-command: ${CLAUDE_COMMAND:claude}
    default-worker-type: ${CENTRAL_AI_DEFAULT_PROVIDER:CODEX}
  aiproxy:
    anthropic-api-key: ${CENTRAL_ANTHROPIC_API_KEY:}
    anthropic-base-url: ${CENTRAL_ANTHROPIC_BASE_URL:https://api.anthropic.com}
    anthropic-version: ${CENTRAL_ANTHROPIC_VERSION:2023-06-01}
    openai-api-key: ${CENTRAL_OPENAI_API_KEY:}
    openai-base-url: ${CENTRAL_OPENAI_BASE_URL:https://api.openai.com}
    public-base-url: ${CENTRAL_AI_PROXY_PUBLIC_BASE_URL:http://127.0.0.1:8080/api/ai-proxy}
    token-ttl-seconds: ${CENTRAL_AI_PROXY_TOKEN_TTL_SECONDS:28800}

management:
  endpoints:
    web:
      exposure:
        include: health,info
