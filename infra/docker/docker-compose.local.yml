services:
  postgres:
    image: postgres:16
    container_name: synub-agents-postgres
    environment:
      POSTGRES_DB: synub_agents
      POSTGRES_USER: synub_agents
      POSTGRES_PASSWORD: synub_agents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synub_agents -d synub_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
