services:
  postgres:
    image: postgres:16
    container_name: ai-dev-staff-postgres
    environment:
      POSTGRES_DB: ai_dev_staff
      POSTGRES_USER: ai_dev_staff
      POSTGRES_PASSWORD: ai_dev_staff
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dev_staff -d ai_dev_staff"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
